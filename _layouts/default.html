<!doctype html>
<html lang="{{ site.lang | default: 'en-GB' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="alternate" type="application/rss+xml" title="Peter Marc Farrugia — Writing" href="https://petermarcfarrugia.com/feed.xml">
  <link rel="icon" href="{{ '/logo-mark.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/site-nav.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}Peter Marc Farrugia</title>
</head>
<body>
<header class="global-site-header">
  <a class="global-site-name" href="/index.html" aria-label="Peter Marc Farrugia, home">
    <img src="/logo-mark.svg" alt="Peter Marc Farrugia’s terracotta marque" width="52" height="52">
    <span>Peter Marc Farrugia</span>
  </a>
  <nav aria-label="Main navigation">
      <a href="/practice.html">Practice</a>
      <a href="/writing.html">Writing</a>
      <a href="/publications.html">Publications</a>
      <a href="/projects.html">Projects</a>
      <a href="/bio.html">Bio</a>
      <a href="/index.html#contact">Contact</a>
  </nav>
</header>
<main>{{ content }}</main>
<footer class="global-site-footer">
  <p>© 2026 Peter Marc Farrugia <span aria-hidden="true">·</span> <a href="/privacy.html">Privacy</a> <span aria-hidden="true">·</span> <a href="/feed.xml">RSS</a></p>
</footer>
</body>
</html>
