name: Apply clinician-first site revision

on:
  push:
    branches:
      - site-revision-clinician-first
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  revise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v4
        with:
          ref: site-revision-clinician-first
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install revision dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 pillow reportlab requests

      - name: Restore the one-use revision script
        run: cat .github/scripts/site_revision.py.gz.b64.part* | base64 --decode | gzip --decompress > .github/scripts/site_revision.py

      - name: Verify the restored revision script
        run: echo "c36fb887f9ac42455689918ee3022013c0a159213e898b3b86ae39f69e4ef6b4  .github/scripts/site_revision.py" | sha256sum --check -

      - name: Apply generator compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/site_revision.py')
          text = path.read_text()

          selector_old = 'for anchor in soup.select("a.m"):'
          selector_new = 'for anchor in soup.select("a.iusc, a.m"):'
          if selector_old not in text:
              raise SystemExit('Bing image selector not found')
          text = text.replace(selector_old, selector_new)

          footer_old = '''    if "global-site-footer" not in text:
              text = re.sub(r'</body>', footer_markup() + '\\n</body>', text, count=1, flags=re.I)

          path.write_text(text.rstrip() + "\\n", encoding="utf-8")
          '''
          footer_new = '''    if "global-site-footer" not in text:
              text = re.sub(r'</body>', footer_markup() + '\\n</body>', text, count=1, flags=re.I)

          if not re.search(r'<main\\b', text, flags=re.I):
              text = text.replace(nav_markup(), nav_markup() + '\\n<main>', 1)
              text = re.sub(
                  r'(<footer class=["\\\']global-site-footer["\\\'])',
                  r'</main>\\n\\1',
                  text,
                  count=1,
                  flags=re.I,
              )

          path.write_text(text.rstrip() + "\\n", encoding="utf-8")
          '''
          if footer_old not in text:
              raise SystemExit('Existing-page footer block not found')
          text = text.replace(footer_old, footer_new)

          publications_old = '''    publications = (ROOT / "publications.html").read_text(encoding="utf-8")
              if publications.find("Julian") < publications.find("Published"):
                  errors.append("publications.html: Julian article is not under Published")
              if 'href="/cv.pdf"' not in publications or not (ROOT / "cv.pdf").exists():
                  errors.append("publications.html: CV link or file missing")
          '''
          publications_new = '''    publications = (ROOT / "publications.html").read_text(encoding="utf-8")
              publications_soup = BeautifulSoup(publications, "html.parser")
              julian_heading = publications_soup.find(
                  lambda tag: tag.name in {"h2", "h3"}
                  and "Julian of Norwich" in tag.get_text(" ", strip=True)
              )
              published_heading = julian_heading.find_previous("h2") if julian_heading else None
              if not published_heading or published_heading.get_text(" ", strip=True) != "Published":
                  errors.append("publications.html: Julian article is not under Published")
              if 'href="/cv.pdf"' not in publications or not (ROOT / "cv.pdf").exists():
                  errors.append("publications.html: CV link or file missing")
          '''
          if publications_old not in text:
              raise SystemExit('Publications validation block not found')
          text = text.replace(publications_old, publications_new)

          path.write_text(text)
          PY

      - name: Apply and validate the site revision
        run: |
          if python .github/scripts/site_revision.py > /tmp/site-revision.log 2>&1; then
            cat /tmp/site-revision.log
          else
            cp /tmp/site-revision.log revision-error.log
            exit 1
          fi

      - name: Preserve generator failure
        if: failure()
        run: |
          find . -path './.git' -prune -o -type f -print | sort > repo-files.txt
          printf '\nImage assets:\n' >> repo-files.txt
          find . -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.gif' \) -print0 | xargs -0 -r file >> repo-files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revision-error.log repo-files.txt
          git commit -m "Record site revision failure and repository assets"
          git push origin HEAD:site-revision-clinician-first

      - name: Commit the completed revision
        if: success()
        run: |
          rm -f revision-error.log repo-files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild site around clinical practice"
          git push origin HEAD:site-revision-clinician-first
