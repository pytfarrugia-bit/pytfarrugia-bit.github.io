name: Run proposed site restructure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-site-restructure.yml

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposal branch
        uses: actions/checkout@v4
        with:
          ref: site-restructure-20260802
          fetch-depth: 0

      - name: Apply restructure
        run: |
          python - <<'PYCODE'
          import base64
          import zlib
          from pathlib import Path

          workflow = Path('.github/workflows/restructure-site.yml').read_text().splitlines()
          collecting = False
          chunks = []
          for line in workflow:
              if line.strip() == 'MIGRATION_B64: |':
                  collecting = True
                  continue
              if collecting and line.lstrip() == 'run: |':
                  break
              if collecting:
                  chunks.append(line.strip())
          payload = ''.join(chunks)
          script = zlib.decompress(base64.b64decode(payload))
          path = Path('scripts/restructure_site.py')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(script)
          namespace = {'__name__': '__main__', '__file__': str(path.resolve())}
          exec(compile(script, str(path), 'exec'), namespace)
          PYCODE
          rm -f .github/workflows/restructure-pr.yml

      - name: Commit generated site to proposal branch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restructure archive and psychotherapy practice"
          git push origin HEAD:site-restructure-20260802

# Updated after initial registration so the push trigger is active.
